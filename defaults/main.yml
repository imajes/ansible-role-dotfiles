---
dotfiles_repo: https://github.com/imajes/portable-env.git
dotfiles_repo_version: main
dotfiles_repo_accept_hostkey: false
dotfiles_repo_local_destination: ~/.dotfiles

# where to send all the files
dotfiles_home: "~"
# these files are removed from dest
dotfiles_files_to_purge:
  - .config/fish
  - .config/TabNine
  - .bash-preexec.sh
  - .bash_history
  - .bash_logout
  - .bashrc
  - .extras
  - .gnupg
  - .oh-my-zsh
  - .profile
  - .pyenv
  - .vimrc
  - .rdebugrc
  - .zprofile
  - .zsh-evalcache
  - .zshenv
  - .zshrc
  - .zshrc-extras
# creates these folders inside of the dest
dotfiles_folders:
  - .config
  - .extras
  - .zsh
  - bin
# these files/folders are softlinked into the dest
dotfiles_files:
  - .cargo
  - .config/atuin
  - .config/bat
  - .config/gh
  - .config/husky
  - .config/mise
  - .config/neovide
  - .config/nvim
  - .config/wandb
  - .config/wezterm
  - .config/zsh
  - .default-gems
  - .gemrc
  - .gitconfig
  - .gitignore
  - .gitignore_global
  - .gitmodules
  - .gnupg
  - .irbrc
  - .pryrc
  - .sudo_as_admin_successful
  - .tmux
  - .tool-versions
  - .zsh_portable-env
  - bin/zsh-welcome
# these links are where there's a need to put it in a different place from where the source implies
dotfiles_special_links:
  # - dest: .vimrc
  #   src: .config/nvim/init.lua
  - dest: .zshenv
    src: .config/zsh/.zshenv
