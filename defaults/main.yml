---
dotfiles_repo: https://github.com/imajes/portable-env.git
# Select a reviewed, published commit; moving branch names are not a rollout pin.
dotfiles_repo_version: ""
dotfiles_repo_accept_hostkey: false
# Explicit per-account home; the caller runs this role as the account owner.
dotfiles_home: ""
dotfiles_repo_local_destination: "{{ dotfiles_home }}/.dotfiles"
dotfiles_state_directory: "{{ dotfiles_home }}/.local/state/dotfiles"
# Compatibility variable: nonempty purge lists are rejected, never executed.
dotfiles_files_to_purge: []
# Directories select their tracked files, not whole directory replacements.
# Private/runtime neighbors remain untouched, including under existing directory links.
dotfiles_files:
  - .config/aprc
  - .config/atuin/config.toml
  - .config/bat
  - .config/gh/config.yml
  - .config/htop/htoprc
  - .config/husky/init.sh
  - .config/mdcat/config.toml
  - .config/mise/config.toml
  - .config/mise/scripts
  - .config/neovide/config.toml
  - .config/nvim
  - .config/rod/config.toml
  - .config/wezterm
  - .config/zsh
  - .default-gems
  - .gemrc
  - .gitattributes
  - .gitconfig
  - .gitignore_global
  - .irbrc
  - .markdownlint.jsonc
  - .pryrc
  - .shellcheckrc
  - .tidyrc
  - .tool-versions
  - .zsh_portable-env
  - bin/zsh-welcome
dotfiles_special_links:
  - dest: .zshenv
    src: .config/zsh/.zshenv
