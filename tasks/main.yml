---
- name: Require an explicit account and immutable source revision
  ansible.builtin.assert:
    that:
      - dotfiles_home is match('^/')
      - dotfiles_repo_local_destination is match('^/')
      - dotfiles_repo_version is match('^[0-9a-f]{40}$')
      - dotfiles_files_to_purge | length == 0
    fail_msg: Supply an absolute account home and reviewed full commit SHA. Home-directory purges are no longer supported.
- name: Preserve edits to managed checkout files before updating
  dotfiles_state:
    action: prepare
    home: "{{ dotfiles_home }}"
    checkout: "{{ dotfiles_repo_local_destination }}"
    state: "{{ dotfiles_state_directory }}"
    files: "{{ dotfiles_files }}"
    special_links: "{{ dotfiles_special_links }}"
- name: Update the source checkout and pinned submodules in place
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_repo_local_destination }}"
    version: "{{ dotfiles_repo_version }}"
    force: false
    recursive: true
    track_submodules: false
    accept_hostkey: "{{ dotfiles_repo_accept_hostkey }}"
  environment:
    GIT_TERMINAL_PROMPT: "0"
    GIT_LFS_SKIP_SMUDGE: "1"
- name: Link only reviewed tracked configuration and retain account state
  dotfiles_state:
    action: link
    home: "{{ dotfiles_home }}"
    checkout: "{{ dotfiles_repo_local_destination }}"
    state: "{{ dotfiles_state_directory }}"
    files: "{{ dotfiles_files }}"
    special_links: "{{ dotfiles_special_links }}"
